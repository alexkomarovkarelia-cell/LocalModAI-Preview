name: Сообщить об ошибке
description: Ошибка или неправильное поведение тестовой сборки LocalModAI
title: "[Ошибка] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за тестирование LocalModAI. Не публикуйте пароли, платёжные данные и содержимое приватных проектов.
  - type: input
    id: version
    attributes:
      label: Версия LocalModAI
      placeholder: v0.5.0-alpha.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Windows 10 или Windows 11
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Локальная модель
      description: Название GGUF-файла и примерный размер
  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку
      description: Опишите действия по шагам
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Скриншоты и диагностика
      description: Перед публикацией удалите личные данные
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я проверил приложенные файлы и удалил личные данные
          required: true
